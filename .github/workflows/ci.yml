name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated Worker types
        run: pnpm typegen && git diff --exit-code -- worker-configuration.d.ts

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Worker and D1 integration tests
        run: pnpm test:integration

      - name: Build and validate Worker bundle
        run: pnpm deploy:dry-run

      - name: Build and validate production Worker bundle
        run: pnpm deploy:dry-run:production
